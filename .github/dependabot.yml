version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # Microsoft.Build.Framework 18.x pulls Microsoft.NET.StringTools 18.x,
      # which is not compatible with Talvora's current net10.0-windows toolchain.
      # Revisit this guard when the repository moves to the .NET 11 toolchain.
      - dependency-name: "Microsoft.Build.Framework"
        versions:
          - ">=18.0.0"
    groups:
      nuget-stable:
        patterns:
          - "*"
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # Microsoft.Extensions.AI.Abstractions follows ModelContextProtocol's own dependency (10.x for 2.4.0).
      # Raise it together with a ModelContextProtocol update.
      - dependency-name: "Microsoft.Extensions.AI.Abstractions"
        versions:
          - ">=11.0.0"
      # Microsoft.Build.Framework and Microsoft.NET.StringTools follow the SDK's own MSBuild
      # (global.json 10.0.404 ships MSBuild 18.9.15); both are compile-only references (PK2).
      # Raise this bound together with the SDK feature band (`dotnet msbuild -version`).
      - dependency-name: "Microsoft.Build.Framework"
        versions:
          - ">=18.10.0"
      - dependency-name: "Microsoft.NET.StringTools"
        versions:
          - ">=18.10.0"
      # .NET platform packages ship with the runtime and must move together.
      # Bump them only with scripts/Update-DotnetPlatformPackages.ps1 (CI2);
      # single-package bumps cause NU1109 downgrade errors under central transitive pinning.
      - dependency-name: "Microsoft.Data.Sqlite"
      - dependency-name: "Microsoft.Extensions.Caching.Abstractions"
      - dependency-name: "Microsoft.Extensions.Configuration.Abstractions"
      - dependency-name: "Microsoft.Extensions.DependencyInjection.Abstractions"
      - dependency-name: "Microsoft.Extensions.Diagnostics.Abstractions"
      - dependency-name: "Microsoft.Extensions.FileProviders.Abstractions"
      - dependency-name: "Microsoft.Extensions.Hosting.Abstractions"
      - dependency-name: "Microsoft.Extensions.Hosting.WindowsServices"
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
      - dependency-name: "Microsoft.Extensions.Options"
      - dependency-name: "Microsoft.Extensions.Primitives"
      - dependency-name: "System.Composition*"
    groups:
      nuget-stable:
        patterns:
          - "*"
  - package-ecosystem: "dotnet-sdk"
    # SDK PRs must include regenerated solution and installer packages.lock.json files.
    # Run both --force-evaluate restores with the proposed exact SDK before merging;
    # windows-ci rejects SDK-only updates, including Dependabot PRs.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Talvora stays on .NET 10 LTS; .NET 11 is STS (user decision 2026-11-08).
      # The next major move is .NET 12 LTS, decided by Claude at an audit.
      - dependency-name: "dotnet-sdk"
        versions:
          - ">= 11.0.0, < 12.0.0"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

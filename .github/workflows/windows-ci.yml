name: windows-ci

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/Talvora/Talvora.csproj
      - name: Build
        run: dotnet build src/Talvora/Talvora.csproj -c Release --no-restore
      - name: Start and verify health
        shell: pwsh
        run: |
          $process = Start-Process dotnet -ArgumentList @('run','--project','src/Talvora/Talvora.csproj','-c','Release','--no-build') -PassThru -WindowStyle Hidden
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $health = $null
            do {
              try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:7676/healthz' -TimeoutSec 2 -Proxy $null } catch { $health = $null }
              if ($null -ne $health) { break }
              Start-Sleep -Milliseconds 300
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($null -eq $health) { throw 'Talvora health check did not become ready.' }
            if ($health.product -ne 'Talvora') { throw 'Unexpected health product.' }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List | Out-Host; throw "PowerShell parse failed: $($script.Name)" }
          }
      - name: Reject WinGet
        shell: pwsh
        run: |
          $hits = Get-ChildItem -Recurse -File src,scripts,TALVORA-KUR.cmd | Select-String -Pattern '(?i)(^|[^A-Za-z0-9_])winget(\.exe)?([^A-Za-z0-9_]|$)'
          if ($hits) { $hits | ForEach-Object { Write-Error $_.ToString() }; throw 'WinGet is forbidden. Use Chocolatey.' }

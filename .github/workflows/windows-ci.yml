name: Talvora Windows CI

on:
  push:
    branches:
      - main
      - feat/elevated-operation-execution
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: talvora-windows-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore Host smoke target
        run: dotnet restore src/Talvora.Host/Talvora.Host.csproj

      - name: Build Host smoke target
        run: dotnet build src/Talvora.Host/Talvora.Host.csproj --configuration Release --no-restore

      - name: Run MCP Registry catalog RED target
        shell: pwsh
        run: |
          $dotnetPath = (Get-Command dotnet).Source
          & ./scripts/Test-McpSmoke.ps1 -DotNetPath $dotnetPath -Configuration Release

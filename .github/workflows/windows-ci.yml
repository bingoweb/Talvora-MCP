name: Talvora Windows CI

on:
  push:
    branches:
      - main
      - feat/elevated-operation-execution
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: talvora-windows-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Cloudflare tunnel launcher contract
        shell: pwsh
        run: ./tests/Test-CloudflareTunnelLauncher.ps1

      - name: Run Talvora host autostart launcher contract
        shell: pwsh
        run: ./tests/Test-HostAutostartLauncher.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run architecture gate
        shell: pwsh
        run: ./scripts/Test-Architecture.ps1

      - name: Restore solution
        run: dotnet restore Talvora.slnx

      - name: Build Host Release
        run: dotnet build src/Talvora.Host/Talvora.Host.csproj --configuration Release --no-restore

      - name: Build Elevated Broker Release
        run: dotnet build src/Talvora.ElevatedBroker/Talvora.ElevatedBroker.csproj --configuration Release --no-restore

      - name: Run all .NET tests
        run: dotnet test --solution Talvora.slnx --configuration Release --no-restore --verbosity normal

name: windows-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependency graph
        shell: pwsh
        run: |
          dotnet restore Talvora.slnx --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Locked solution restore failed.' }

          dotnet restore src/Talvora.Installer/Talvora.Installer.csproj --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Locked installer restore failed.' }

      - name: Build non-payload projects
        shell: pwsh
        run: |
          dotnet build Talvora.slnx -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Canonical solution build failed.' }

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errorsFound = @()
          foreach ($script in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errorsFound += $errors }
          }
          if ($errorsFound.Count) {
            $errorsFound | Format-List | Out-Host
            throw 'PowerShell parse failed.'
          }

      - name: Reject WinGet
        shell: pwsh
        run: |
          $hits = @(
            & git grep -n -I -i -E '(^|[^A-Za-z0-9_])winget(\.exe)?([^A-Za-z0-9_]|$)' -- src scripts TALVORA-KUR.cmd TALVORA-BUSINESS-KUR.cmd
          )
          if ($LASTEXITCODE -notin 0, 1) {
            throw "git grep failed with exit code $LASTEXITCODE."
          }
          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { Write-Error $_ }
            throw 'WinGet is forbidden. Use Chocolatey.'
          }
          # git grep returns 1 when there are no matches; do not let the
          # GitHub pwsh wrapper treat that expected result as step failure.
          exit 0

      - name: Validate source contracts
        shell: pwsh
        run: |
          & ./scripts/Validate-Context7Gate.ps1
          if (-not $?) { throw 'Context7 quality gate failed.' }

          & ./tests/ModernizationPolicyRegression.ps1
          if (-not $?) { throw 'Modernization policy regression failed.' }

          & ./tests/ThirdPartyNoticesSourceRegression.ps1
          if (-not $?) { throw 'Third-party notices regression failed.' }

          & ./tests/TunnelClientV015IntegrationSourceRegression.ps1
          if (-not $?) { throw 'Tunnel-client v0.0.15 integration regression failed.' }

          & ./tests/StorageMaintenanceSourceRegression.ps1
          if (-not $?) { throw 'Storage maintenance regression failed.' }

          & ./tests/StorageMaintenanceBehaviorRegression.ps1
          if (-not $?) { throw 'Storage maintenance behavior regression failed.' }

          & ./tests/ControlCenterUiResponsivenessSourceRegression.ps1
          if (-not $?) { throw 'Control Center UI responsiveness regression failed.' }

          & ./tests/PenpotOnDemandSourceRegression.ps1
          if (-not $?) { throw 'Penpot on-demand regression failed.' }

          & ./tests/NativeInstallerSourceRegression.ps1
          if (-not $?) { throw 'Native installer source regression failed.' }

          foreach ($test in @(
            './tests/FileListMetadataRegression.ps1',
            './tests/KnowledgeSearchScanRegression.ps1',
            './tests/RuntimeIdentityCacheRegression.ps1',
            './tests/RuntimeMetadataCacheRegression.ps1',
            './tests/SmokeKnowledgeRootsIsolationRegression.ps1',
            './tests/ProcessRunnerRegression.ps1'
          )) {
            & $test
            if (-not $?) { throw "Regression failed: $test" }
          }

      - name: Validate desktop notification behavior
        shell: pwsh
        run: |
          dotnet run --project tests/Talvora.Notification.Regression/Talvora.Notification.Regression.csproj -c Release --no-build --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Desktop notification behavior regression failed.' }

      - name: Start and verify current MCP surface
        shell: pwsh
        run: |
          $process = Start-Process dotnet -ArgumentList @('run','--project','src/Talvora/Talvora.csproj','-c','Release','--no-build') -PassThru -WindowStyle Hidden
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $health = $null
            do {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:7676/healthz' -TimeoutSec 2 -Proxy $null
              }
              catch {
                $health = $null
              }
              if ($null -ne $health) { break }
              Start-Sleep -Milliseconds 300
            } while ([DateTime]::UtcNow -lt $deadline)

            if ($null -eq $health) { throw 'Talvora health check did not become ready.' }

            dotnet run --project tests/Talvora.Smoke/Talvora.Smoke.csproj -c Release --no-build -- '--surface-policy-live' 'http://127.0.0.1:7676'
            if ($LASTEXITCODE -ne 0) { throw "MCP surface smoke failed: $LASTEXITCODE" }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Validate ChatGPT Business bootstrap
        shell: pwsh
        run: |
          $script = (Resolve-Path './scripts/Configure-ChatGPT-Business.ps1').Path
          & $script -SelfTest
          if (-not $?) { throw 'Business bootstrap self-test failed.' }

          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 Business bootstrap self-test failed.' }

      - name: Build canonical native installer
        shell: pwsh
        run: |
          & ./scripts/Build-Windows-Installer.ps1
          if (-not $?) { throw 'Native installer build failed.' }
          if (-not (Test-Path './artifacts/installer/Talvora-Setup.exe')) { throw 'Talvora-Setup.exe was not produced.' }

      - name: Install and verify canonical runtime
        shell: pwsh
        run: |
          & ./scripts/Install.ps1 -RepoRoot $PWD.Path -SkipBuild
          if (-not $?) { throw 'Canonical install wrapper failed.' }

          $service = Get-CimInstance Win32_Service -Filter "Name='Talvora'"
          if ($null -eq $service -or $service.State -ne 'Running') { throw 'Talvora service is not running.' }
          if ($service.StartName -ne 'LocalSystem') { throw "Talvora service account is $($service.StartName)" }

          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:7676/healthz' -TimeoutSec 5 -Proxy $null
          if ($health.sid -ne 'S-1-5-18') { throw "Talvora service SID is $($health.sid)" }
          if (-not $health.isWindowsService) { throw 'Talvora process did not detect Windows Service hosting.' }

          $toolManifest = [IO.File]::ReadAllText((Join-Path $PWD.Path 'src/Talvora.Shared/TalvoraToolManifest.cs'))
          $expectedToolCount = ([regex]::Matches($toolManifest, '"(?:talvora_[a-z0-9_]+|search|fetch)"')).Count

          $statePath = Join-Path $env:LOCALAPPDATA 'Talvora\current.json'
          if (-not (Test-Path -LiteralPath $statePath -PathType Leaf)) { throw "Talvora state file missing: $statePath" }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          if ([int]$state.ToolCount -ne $expectedToolCount) { throw "State ToolCount mismatch. Expected=$expectedToolCount Actual=$($state.ToolCount)" }

          # Hosted runners do not provide the durable interactive-user session required by the full smoke.
          dotnet run --project tests/Talvora.Smoke/Talvora.Smoke.csproj -c Release --no-build -- '--surface-policy-live' 'http://127.0.0.1:7676'
          if ($LASTEXITCODE -ne 0) { throw 'Installed MCP surface smoke failed.' }

      - name: Clean service test
        if: always()
        shell: pwsh
        run: |
          Get-Process Talvora.Tray -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $service = Get-Service -Name Talvora -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            if ($service.Status -ne 'Stopped') { Stop-Service Talvora -Force -ErrorAction SilentlyContinue }
            & "$env:SystemRoot\System32\sc.exe" delete Talvora | Out-Host
          }

          Remove-Item -LiteralPath 'C:\Program Files\Talvora' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:ProgramData 'Talvora') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:LOCALAPPDATA 'Talvora') -Recurse -Force -ErrorAction SilentlyContinue

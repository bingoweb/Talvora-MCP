name: Talvora Windows CI

on:
  push:
    branches:
      - main
      - feat/elevated-operation-execution
  pull_request:
    branches:
      - main

concurrency:
  group: talvora-focused-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore focused test project
        run: dotnet restore tests/Talvora.Ipc.Tests/Talvora.Ipc.Tests.csproj

      - name: Build focused test project
        run: dotnet build tests/Talvora.Ipc.Tests/Talvora.Ipc.Tests.csproj --configuration Release --no-restore

      - name: Run focused TDD test
        run: dotnet test tests/Talvora.Ipc.Tests/Talvora.Ipc.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Talvora.Ipc.Tests.ElevatedOperationExecutorTests.BrokerControlServiceOwnsExecuteRpc" --verbosity normal

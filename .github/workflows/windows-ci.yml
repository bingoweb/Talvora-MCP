name: windows-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src/Talvora/Talvora.csproj
          dotnet restore tests/Talvora.Smoke/Talvora.Smoke.csproj
      - name: Build
        shell: pwsh
        run: |
          dotnet build src/Talvora/Talvora.csproj -c Release --no-restore
          dotnet build tests/Talvora.Smoke/Talvora.Smoke.csproj -c Release --no-restore
      - name: Start and verify real MCP tools
        shell: pwsh
        run: |
          $process = Start-Process dotnet -ArgumentList @('run','--project','src/Talvora/Talvora.csproj','-c','Release','--no-build') -PassThru -WindowStyle Hidden
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $health = $null
            do {
              try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:7676/healthz' -TimeoutSec 2 -Proxy $null } catch { $health = $null }
              if ($null -ne $health) { break }
              Start-Sleep -Milliseconds 300
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($null -eq $health) { throw 'Talvora health check did not become ready.' }
            if ($health.product -ne 'Talvora') { throw 'Unexpected health product.' }
            dotnet run --project tests/Talvora.Smoke/Talvora.Smoke.csproj -c Release --no-build -- 'http://127.0.0.1:7676/mcp'
            if ($LASTEXITCODE -ne 0) { throw "MCP smoke failed: $LASTEXITCODE" }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List | Out-Host; throw "PowerShell parse failed: $($script.Name)" }
          }
      - name: Reject WinGet
        shell: pwsh
        run: |
          $hits = Get-ChildItem -Recurse -File src,scripts,tests,TALVORA-KUR.cmd | Select-String -Pattern '(?i)(^|[^A-Za-z0-9_])winget(\.exe)?([^A-Za-z0-9_]|$)'
          if ($hits) { $hits | ForEach-Object { Write-Error $_.ToString() }; throw 'WinGet is forbidden. Use Chocolatey.' }
      - name: Install and verify LocalSystem service
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Windows CI runner must be elevated for the real service test.'
          }
          $clientHome = Join-Path $env:RUNNER_TEMP 'talvora-codex'
          & ./scripts/Install.ps1 -RepoRoot $PWD.Path -ClientHome $clientHome
          if ($LASTEXITCODE -ne 0) { throw "Install.ps1 failed: $LASTEXITCODE" }
          $service = Get-CimInstance Win32_Service -Filter "Name='Talvora'"
          if ($service.State -ne 'Running') { throw "Talvora service state is $($service.State)" }
          if ($service.StartName -ne 'LocalSystem') { throw "Talvora service account is $($service.StartName)" }
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:7676/healthz' -TimeoutSec 5 -Proxy $null
          if ($health.sid -ne 'S-1-5-18') { throw "Talvora service SID is $($health.sid)" }
          if (-not $health.isWindowsService) { throw 'Talvora process did not detect Windows Service hosting.' }
      - name: Clean service test
        if: always()
        shell: pwsh
        run: |
          $service = Get-Service -Name Talvora -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            if ($service.Status -ne 'Stopped') { Stop-Service Talvora -Force -ErrorAction SilentlyContinue }
            & "$env:SystemRoot\System32\sc.exe" delete Talvora | Out-Host
          }
          Remove-Item -LiteralPath (Join-Path $env:ProgramData 'Talvora') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:LOCALAPPDATA 'Talvora') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'talvora-codex') -Recurse -Force -ErrorAction SilentlyContinue

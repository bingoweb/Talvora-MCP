name: Talvora Windows CI

on:
  push:
    branches:
      - main
      - feat/windows-registry-management
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: talvora-windows-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify preinstalled .NET SDK
        shell: pwsh
        run: |
          $version = dotnet --version
          Write-Host "Using .NET SDK $version"
          if (-not $version.StartsWith("10.0.")) {
            throw "Expected a .NET 10 SDK, got $version"
          }

      - name: Restore Host
        run: dotnet restore src/Talvora.Host/Talvora.Host.csproj

      - name: Build Host registry composition
        run: dotnet build src/Talvora.Host/Talvora.Host.csproj --configuration Release --no-restore --verbosity normal

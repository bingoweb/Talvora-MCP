name: Talvora Windows CI

on:
  push:
    branches:
      - main
      - feat/elevated-operation-execution
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: talvora-windows-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore IPC target test
        run: dotnet restore tests/Talvora.Ipc.Tests/Talvora.Ipc.Tests.csproj

      - name: Run elevated Registry protocol diagnostic target
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          & dotnet test tests/Talvora.Ipc.Tests/Talvora.Ipc.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~Talvora.Ipc.Tests.ElevatedRegistryProtocolContractTests.ProtocolV2CarriesRegistryMutationAndRegistryResult" --verbosity normal --results-directory TestResults --logger "trx;LogFileName=elevated-registry-protocol.trx" 2>&1 | Tee-Object -FilePath TestResults/elevated-registry-protocol.txt
          $testExitCode = $LASTEXITCODE
          Set-Content -Path TestResults/exit-code.txt -Value $testExitCode -Encoding utf8
          exit 0

      - name: Upload Registry protocol diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elevated-registry-protocol-diagnostics
          path: TestResults/

      - name: Preserve Registry protocol test result
        if: always()
        shell: pwsh
        run: |
          $testExitCode = [int](Get-Content TestResults/exit-code.txt -Raw)
          exit $testExitCode

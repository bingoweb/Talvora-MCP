name: windows-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require lock files with SDK updates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $headRef = [string]$event.pull_request.head.sha
            $baseRef = & git merge-base ([string]$event.pull_request.base.sha) $headRef
            if ($LASTEXITCODE -ne 0) { throw 'SDK lock gate could not determine the PR merge base.' }
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $headRef = [string]$event.after
            $baseRef = [string]$event.before
            if ($baseRef -match '^0{40}$') {
              # A new branch has no previous commit; compare against the empty tree.
              $baseRef = '' | & git hash-object -t tree --stdin
              if ($LASTEXITCODE -ne 0) { throw 'SDK lock gate could not determine the empty tree.' }
            }
          }
          else { throw 'SDK lock gate requires a pull_request or push event.' }
          if ([string]::IsNullOrWhiteSpace($baseRef) -or [string]::IsNullOrWhiteSpace($headRef)) {
            throw 'SDK lock gate requires valid base and head revisions.'
          }
          $changedFiles = @(& git diff --name-only --no-renames $baseRef $headRef)
          if ($LASTEXITCODE -ne 0) { throw 'SDK lock gate could not read the event change set; ensure both revisions are available.' }
          $updatedFiles = @(& git diff --name-only --no-renames --diff-filter=AM $baseRef $headRef)
          if ($LASTEXITCODE -ne 0) { throw 'SDK lock gate could not read updated lock files.' }
          if ($changedFiles -contains 'global.json' -and -not ($updatedFiles -cmatch '^(src|tests)/.+/packages\.lock\.json$')) {
            throw 'global.json changed without updated NuGet lock files. Install the exact SDK from global.json, run dotnet restore Talvora.slnx --force-evaluate and dotnet restore src/Talvora.Installer/Talvora.Installer.csproj --force-evaluate without environment overrides, and include the changed packages.lock.json files in the same PR (including Dependabot SDK PRs).'
          }

      - name: Classify the change
        id: changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $headRef = [string]$event.pull_request.head.sha
            $baseRef = [string](& git merge-base ([string]$event.pull_request.base.sha) $headRef)
          }
          else {
            $headRef = [string]$event.after
            $baseRef = [string]$event.before
          }
          # T4: a change made only of Markdown documents under docs/ (reference copies excluded) cannot change
          # the build or the runtime; it runs the changed-scope gate instead of the full build and install.
          # Anything that cannot be classified (a new branch, an unreadable range) runs the full pipeline.
          $docsOnly = $false
          if ($baseRef -match '^[0-9a-f]{40}$' -and $baseRef -notmatch '^0{40}$') {
            $changedFiles = @(& git diff --name-only --no-renames $baseRef $headRef)
            if ($LASTEXITCODE -ne 0) { throw 'CI could not read the change set.' }
            $docsOnly = $changedFiles.Count -gt 0 -and
              @($changedFiles | Where-Object { $_ -notmatch '^docs/.+\.md$' -or $_ -match '^docs/codex/reference/' }).Count -eq 0
          }
          "docs_only=$($docsOnly.ToString().ToLowerInvariant())" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "base_ref=$baseRef" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate documentation-only change
        if: steps.changes.outputs.docs_only == 'true'
        shell: pwsh
        env:
          TALVORA_CI_BASE: ${{ steps.changes.outputs.base_ref }}
        run: |
          & ./scripts/Invoke-QualityGate.ps1 -Scope Changed -Base $env:TALVORA_CI_BASE
          if ($LASTEXITCODE -ne 0) { throw 'Changed-scope quality gate failed.' }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.changes.outputs.docs_only != 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Validate build and all test suites (including SourceEdit)
        if: steps.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          & ./scripts/Invoke-QualityGate.ps1 -Scope Full
          if ($LASTEXITCODE -ne 0) { throw 'Unified quality gate failed.' }

      - name: Start and verify current MCP surface
        if: steps.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          $process = Start-Process dotnet -ArgumentList @('run','--project','src/Talvora/Talvora.csproj','-c','Release','--no-build') -PassThru -WindowStyle Hidden
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $health = $null
            do {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:7676/healthz' -TimeoutSec 2 -Proxy $null
              }
              catch {
                $health = $null
              }
              if ($null -ne $health) { break }
              Start-Sleep -Milliseconds 300
            } while ([DateTime]::UtcNow -lt $deadline)

            if ($null -eq $health) { throw 'Talvora health check did not become ready.' }

            dotnet run --project tests/Talvora.Smoke/Talvora.Smoke.csproj -c Release --no-build -- '--surface-policy-live' 'http://127.0.0.1:7676'
            if ($LASTEXITCODE -ne 0) { throw "MCP surface smoke failed: $LASTEXITCODE" }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build canonical native installer
        if: steps.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          & ./scripts/Build-Windows-Installer.ps1
          if (-not $?) { throw 'Native installer build failed.' }
          if (-not (Test-Path './artifacts/installer/Talvora-Setup.exe')) { throw 'Talvora-Setup.exe was not produced.' }

      - name: Install and verify canonical runtime
        if: steps.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          & ./scripts/Install.ps1 -RepoRoot $PWD.Path -SkipBuild
          if (-not $?) { throw 'Canonical install wrapper failed.' }

          $service = Get-CimInstance Win32_Service -Filter "Name='Talvora'"
          if ($null -eq $service -or $service.State -ne 'Running') { throw 'Talvora service is not running.' }
          if ($service.StartName -ne 'LocalSystem') { throw "Talvora service account is $($service.StartName)" }

          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:7676/healthz' -TimeoutSec 5 -Proxy $null
          if ($health.sid -ne 'S-1-5-18') { throw "Talvora service SID is $($health.sid)" }
          if (-not $health.isWindowsService) { throw 'Talvora process did not detect Windows Service hosting.' }

          $toolManifest = [IO.File]::ReadAllText((Join-Path $PWD.Path 'src/Talvora.Shared/TalvoraToolManifest.cs'))
          $expectedToolCount = ([regex]::Matches($toolManifest, '"(?:talvora_[a-z0-9_]+|search|fetch)"')).Count

          $statePath = Join-Path $env:LOCALAPPDATA 'Talvora\current.json'
          if (-not (Test-Path -LiteralPath $statePath -PathType Leaf)) { throw "Talvora state file missing: $statePath" }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          if ([int]$state.ToolCount -ne $expectedToolCount) { throw "State ToolCount mismatch. Expected=$expectedToolCount Actual=$($state.ToolCount)" }

          # Hosted runners do not provide the durable interactive-user session required by the full smoke.
          dotnet run --project tests/Talvora.Smoke/Talvora.Smoke.csproj -c Release --no-build -- '--surface-policy-live' 'http://127.0.0.1:7676'
          if ($LASTEXITCODE -ne 0) { throw 'Installed MCP surface smoke failed.' }

      - name: Validate installed health handle stability
        if: steps.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          & ./tests/HealthHandleRegression.ps1
          if (-not $?) { throw 'Installed service health-handle regression failed.' }

      - name: Validate optional signed-in desktop installation
        if: steps.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          # This integration fixture needs a real interactive Windows logon.
          # Hosted CI runners generally do not provide one.
          $desktopUser = (Get-CimInstance Win32_ComputerSystem).UserName
          if ([string]::IsNullOrWhiteSpace($desktopUser)) {
            Write-Host 'SKIP NativeInstallerRuntime: no signed-in interactive desktop.'
          }
          else {
            & ./tests/NativeInstallerRuntimeRegression.ps1
            if (-not $?) { throw 'Installed desktop runtime regression failed.' }
            $service = Get-CimInstance Win32_Service -Filter "Name='Talvora'"
            $versionRoot = Split-Path -Parent (Split-Path -Parent $service.PathName.Trim('"'))
            $tray = Join-Path $versionRoot 'Tray/Talvora.Tray.exe'
            $env:TALVORA_CONTROL_CENTER_PREVIEW_PNG = Join-Path $env:RUNNER_TEMP 'control-center.png'
            $smoke = Start-Process -FilePath $tray -ArgumentList @('--control-center-smoke') -Wait -PassThru -WindowStyle Hidden
            if ($smoke.ExitCode -ne 0) { throw "Installed Control Center smoke returned $($smoke.ExitCode)." }
            foreach ($name in @('control-center.png', 'control-center-loaded.png')) {
              if (-not (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP $name) -PathType Leaf)) {
                throw "Installed Control Center preview missing: $name"
              }
            }
          }

      - name: Clean service test
        if: always() && steps.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          Get-Process Talvora.Tray -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $service = Get-Service -Name Talvora -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            if ($service.Status -ne 'Stopped') { Stop-Service Talvora -Force -ErrorAction SilentlyContinue }
            & "$env:SystemRoot\System32\sc.exe" delete Talvora | Out-Host
          }

          Remove-Item -LiteralPath 'C:\Program Files\Talvora' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:ProgramData 'Talvora') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:LOCALAPPDATA 'Talvora') -Recurse -Force -ErrorAction SilentlyContinue

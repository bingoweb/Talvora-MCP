name: Talvora Windows CI

on:
  push:
    branches:
      - main
      - feat/elevated-operation-execution
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: talvora-windows-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore IPC target test
        run: dotnet restore tests/Talvora.Ipc.Tests/Talvora.Ipc.Tests.csproj

      - name: Run Registry mutation routing RED target
        run: dotnet test tests/Talvora.Ipc.Tests/Talvora.Ipc.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~Talvora.Ipc.Tests.RegistryMutationRoutingTests.RegistryMutationsFallBackToBrokerAndHonorExplicitElevation" --verbosity normal

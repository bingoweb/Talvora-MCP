name: Talvora Windows CI

on:
  push:
    branches:
      - main
      - feat/elevated-operation-execution
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_filter:
        description: Fully qualified dotnet test filter
        required: false
        default: FullyQualifiedName~Talvora.Architecture.Tests

concurrency:
  group: talvora-focused-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      TALVORA_TEST_FILTER: ${{ github.event.inputs.test_filter || 'FullyQualifiedName~Talvora.Architecture.Tests' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore architecture test project
        run: dotnet restore tests/Talvora.Architecture.Tests/Talvora.Architecture.Tests.csproj

      - name: Build architecture test project
        run: dotnet build tests/Talvora.Architecture.Tests/Talvora.Architecture.Tests.csproj --configuration Release --no-restore

      - name: Run architecture boundary tests
        run: dotnet test tests/Talvora.Architecture.Tests/Talvora.Architecture.Tests.csproj --configuration Release --no-build --filter "$env:TALVORA_TEST_FILTER" --verbosity normal

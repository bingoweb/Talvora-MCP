name: Talvora Windows CI

on:
  push:
    branches:
      - main
      - feat/elevated-operation-execution
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: talvora-windows-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  host-autostart-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Talvora host autostart launcher contract
        shell: pwsh
        run: ./tests/Test-HostAutostartLauncher.ps1

name: local-recovery-ci
on:
  push:
    branches: [ 'talvora-2/**' ]
    paths: [ 'v2/scripts/**', 'v2/tests/local-recovery/**', '.github/workflows/local-recovery-ci.yml' ]
  workflow_dispatch:
jobs:
  local-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 local recovery regression
        run: ./tests/local-recovery/local-recovery.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test existing six-tool Gateway
        run: |
          dotnet test tests/Talvora.Foundation.Tests/Talvora.Foundation.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Talvora.McpSmoke/Talvora.McpSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Task registration and real local MCP lifecycle
        run: ./tests/local-recovery/local-recovery.ps1 -Integration

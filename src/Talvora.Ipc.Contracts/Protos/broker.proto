syntax = "proto3";

option csharp_namespace = "Talvora.Ipc.Contracts.Grpc";

package talvora.ipc.v2;

service BrokerControl {
  rpc Health (BrokerHealthRequest) returns (BrokerHealthResponse);
  rpc Execute (ElevatedOperationRequest) returns (ElevatedOperationResponse);
}

message BrokerHealthRequest {
  int32 protocol_version = 1;
}

message BrokerHealthResponse {
  int32 protocol_version = 1;
  bool ready = 2;
  string service_version = 3;
  bool is_elevated = 4;
  int32 process_id = 5;
}

message ElevatedOperationRequest {
  string operation_id = 1;
  int32 protocol_version = 2;
  int64 timeout_milliseconds = 3;

  oneof operation {
    ShellExecutionOperation shell = 10;
    ProcessExecutionOperation process = 11;
    RegistryMutationOperation registry = 12;
  }
}

message ElevatedOperationResponse {
  string operation_id = 1;
  int32 protocol_version = 2;
  bool success = 3;
  ElevatedExecutionResult execution = 4;
  TalvoraErrorContract error = 5;
  RegistryOperationResult registry = 6;
}

enum ElevatedShellKind {
  ELEVATED_SHELL_KIND_UNSPECIFIED = 0;
  ELEVATED_SHELL_KIND_POWERSHELL = 1;
  ELEVATED_SHELL_KIND_CMD = 2;
}

message ShellExecutionOperation {
  string command = 1;
  ElevatedShellKind shell = 2;
  bool load_profile = 3;
  string working_directory = 4;
  repeated EnvironmentVariable environment = 5;
}

enum ProcessExecutionMode {
  PROCESS_EXECUTION_MODE_WAIT_FOR_EXIT = 0;
  PROCESS_EXECUTION_MODE_START_ONLY = 1;
}

message ProcessExecutionOperation {
  string file_name = 1;
  repeated string arguments = 2;
  string working_directory = 3;
  repeated EnvironmentVariable environment = 4;
  bool create_no_window = 5;
  ProcessExecutionMode mode = 6;
}

enum RegistryMutationKind {
  REGISTRY_MUTATION_KIND_UNSPECIFIED = 0;
  REGISTRY_MUTATION_KIND_WRITE_VALUE = 1;
  REGISTRY_MUTATION_KIND_DELETE_VALUE = 2;
  REGISTRY_MUTATION_KIND_CREATE_KEY = 3;
  REGISTRY_MUTATION_KIND_DELETE_KEY = 4;
}

enum RegistryHive {
  REGISTRY_HIVE_UNSPECIFIED = 0;
  REGISTRY_HIVE_CLASSES_ROOT = 1;
  REGISTRY_HIVE_CURRENT_USER = 2;
  REGISTRY_HIVE_LOCAL_MACHINE = 3;
  REGISTRY_HIVE_USERS = 4;
  REGISTRY_HIVE_CURRENT_CONFIG = 5;
}

enum RegistryView {
  REGISTRY_VIEW_DEFAULT = 0;
  REGISTRY_VIEW_32 = 1;
  REGISTRY_VIEW_64 = 2;
}

enum RegistryValueType {
  REGISTRY_VALUE_TYPE_UNSPECIFIED = 0;
  REGISTRY_VALUE_TYPE_NONE = 1;
  REGISTRY_VALUE_TYPE_TEXT = 2;
  REGISTRY_VALUE_TYPE_EXPANDABLE_TEXT = 3;
  REGISTRY_VALUE_TYPE_BINARY = 4;
  REGISTRY_VALUE_TYPE_DWORD = 5;
  REGISTRY_VALUE_TYPE_MULTI_TEXT = 6;
  REGISTRY_VALUE_TYPE_QWORD = 7;
}

message RegistryMutationOperation {
  RegistryMutationKind kind = 1;
  RegistryHive hive = 2;
  string sub_key_path = 3;
  optional string value_name = 4;
  RegistryView view = 5;
  bool recursive = 6;
  RegistryValueType value_type = 7;
  optional string string_value = 8;
  optional int32 dword_value = 9;
  optional int64 qword_value = 10;
  repeated string multi_string_value = 11;
  optional bytes binary_value = 12;
}

message RegistryOperationResult {
  bool completed = 1;
}

message EnvironmentVariable {
  string name = 1;
  optional string value = 2;
}

message ElevatedExecutionResult {
  int32 process_id = 1;
  optional int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
  int64 duration_milliseconds = 5;
}

message TalvoraErrorContract {
  string code = 1;
  string message = 2;
  string operation = 3;
  optional int32 native_code = 4;
  bool retryable = 5;
  map<string, string> details = 6;
}
